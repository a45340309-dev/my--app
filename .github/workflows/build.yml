name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          unzip -o  remix-hollow.zip -d. || unzip -o.github/workflows/remix-hollow.zip -d. || true
          cd remix-hollow
          chmod +x gradlew
              /gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-file
          path: remix-hollow/app/build/outputs/apk/debug/*.apk
