name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          # unzip if zip exists
          for f in $(find . -maxdepth 2 -name "*.zip"); do unzip -o "$f" -d .; rm "$f"; done
          FILE=$(find . -name "settings.gradle*" | head -n 1)
          cd $(dirname "$FILE")
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || true
          echo "---BUILD LOG TAIL---"
          tail -n 200 build.log

      - name: Upload Logs and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build.log
            **/app/build/outputs/logs/*.txt
            
