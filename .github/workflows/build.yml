name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      
      - name: Build Debug APK
        run: |
          ls -la
          echo "--- Checking for zip ---"
          if [ -f "remix-hollow.zip" ]; then unzip -o remix-hollow.zip; rm remix-hollow.zip; fi
          if [ -f "holo.zip" ]; then unzip -o holo.zip; rm holo.zip; fi
          ls -la
          find . -type f -name "settings.gradle*" | head -n 5
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          if [ -z "$GRADLEW_PATH" ]; then echo "gradlew not found, trying direct gradle"; gradle assembleDebug; exit 0; fi
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
            
