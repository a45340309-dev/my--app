name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          unzip -o   remix-hollow.zip || unzip -o.github/workflows/remix-hollow.zip || true
          ls -la
          cd remix-hollow
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-file
          path: remix-hollow/app/build/outputs/apk/debug/*.apk
